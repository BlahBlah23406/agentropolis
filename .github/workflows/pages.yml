name: City on GitHub Pages

# Publishes the browser city as a static site, so anyone can use it from a
# link with nothing to install. Everything runs in the visitor's browser.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node --test test/city-core.test.js
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r city src _site/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=city/"><title>Agentropolis</title><a href="city/">Open the city</a>\n' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
