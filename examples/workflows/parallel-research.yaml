# Parallel fan-out: three perspectives on the same question, at once.
#
# The result is a map of agent name -> output. A branch that fails is reported
# in a `workflow:partial` event; the run still returns the branches that worked.
name: parallel-research
type: parallel

agents:
  - researcher
  - engineer
  - writer

parallel:
  agents:
    - researcher
    - engineer
    - writer
  input: $INPUT
  output: perspectives
